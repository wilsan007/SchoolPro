overrides:
  "@auth/core": ">=0.41.3"
  postcss: ">=8.5.18"
  sharp: ">=0.35.0"
  next>postcss: ">=8.5.18"
  tar: ^7.5.16
  # CVE-2026-14257 + contournement : DoS par expansion non bornée.
  # Override conditionnel : seul brace-expansion >=4.0.0 (vulnérable) est
  # forcé à 5.0.9. Les versions 1.x/2.x/3.x (utilisées par minimatch@3)
  # gardent leur API originale et ne sont pas affectées par la CVE.
  "brace-expansion@>=4.0.0": "5.0.9"
  # GHSA-w5hq-g745-h8pq : dépassement de buffer dans uuid v3/v5/v6.
  # Seul uuid <11.1.1 (vulnérable) est forcé à 11.1.1.
  "uuid@<11.1.1": "11.1.1"
  # GHSA-5p4m-2wfm-xmqj : consommation CPU quadratique dans js-yaml 4.x.
  # Pin à 4.3.1 (pas >= car la 5.x casse l'API ESLint 8).
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  # GHSA-ggr8-5vv4-36mx : épuisement de pile sur objets récursifs.
  # Seul deepmerge-ts <8.0.0 (vulnérable) est forcé à 8.0.2.
  "deepmerge-ts@<8.0.0": "8.0.2"
  # chromedriver — `@axe-core/cli@4.13.0` dépend de `chromedriver: "latest"`.
  # Un DIST-TAG ne peut pas être figé : à chaque `pnpm install`, pnpm
  # redemande au registre « la dernière version publiée », la compare au
  # lockfile et le réécrit (bump 153.0.3 → 154.0.0 observé à CHAQUE commande,
  # y compris `pnpm tsc`). C'est la cause du réalignement du commit f2cc153,
  # réapparu depuis : le lockfile ne pourra JAMAIS être stable tant que ce
  # dist-tag reste libre. On l'épingle donc ici, comme les correctifs CVE.
  #
  # POUR MONTER DE VERSION (délibérément, jamais par accident) :
  #   1. installer le Chrome correspondant sur le poste de développement ;
  #   2. `pnpm audit:axe` sur une page de l'application, et vérifier le rapport ;
  #   3. mettre à jour cette épingle ET package.json, puis `pnpm install`,
  #      et committer le lockfile dans le MÊME commit.
  chromedriver: 153.0.3

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - sharp
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - unrs-resolver
  - tesseract.js

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
  chromedriver: false
  cpu-features: false
  protobufjs: false
  ssh2: false
