# ============================================================
# EcolPro — pg_hba pour le LABO DE TEST (docker-compose.test.yml)
#
# Reprend la production (docker/postgres/pg_hba.conf) sur ce qui compte
# pour les tests de sécurité :
#   - scram-sha-256 partout (jamais de `trust`) ;
#   - TLS exigé (hostssl) pour les quatre rôles applicatifs ;
#   - le superutilisateur `postgres` reste refusé par le réseau : un test
#     qui « marche » en superutilisateur ne prouve RIEN sur la RLS,
#     puisqu'un superutilisateur la contourne intégralement.
#
# SEULE DIFFÉRENCE avec la production : la plage source est ouverte
# (0.0.0.0/0 au lieu de 172.16.0.0/12). En production, l'adresse source
# est celle du réseau Docker interne ; dans le labo, elle dépend de la
# passerelle Docker de la machine de développement (variable selon
# Docker Desktop / Colima / Linux). Restreindre ici ne protégerait rien
# — le port n'est publié que sur 127.0.0.1 — et rendrait le labo
# capricieux selon le poste.
# ============================================================

# --- Connexions locales (socket Unix, à l'intérieur du conteneur) ---------
local    all          postgres                           peer
local    all          all                                scram-sha-256

# --- Les quatre rôles applicatifs : TLS + mot de passe obligatoires ------
hostssl  all          ecolpro_app       0.0.0.0/0        scram-sha-256
hostssl  all          ecolpro_owner     0.0.0.0/0        scram-sha-256
hostssl  all          ecolpro_backup    0.0.0.0/0        scram-sha-256
hostssl  all          ecolpro_ro        0.0.0.0/0        scram-sha-256

# --- Tout le reste est refusé, superutilisateur en tête -------------------
host     all          postgres          0.0.0.0/0        reject
host     all          postgres          ::/0             reject
host     all          all               0.0.0.0/0        reject
host     all          all               ::/0             reject
