# ============================================================
# EcolPro — Configuration PostgreSQL 17
#
# Cible : VPS 8 Go RAM / 4 vCPU. Pour 16 Go, doubler shared_buffers
# et effective_cache_size (voir DEPLOYMENT-VPS.md).
# ============================================================

# --- Connexions ---------------------------------------------------------
# PgBouncer mutualise les connexions : PostgreSQL n'a donc pas besoin d'un
# max_connections élevé. 100 laisse de la marge pour les migrations,
# pgBackRest et une session d'administration.
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 5

# --- Mémoire ------------------------------------------------------------
shared_buffers = 2GB                  # ~25 % de 8 Go
effective_cache_size = 6GB            # ~75 % de 8 Go
work_mem = 16MB                       # par opération de tri, pas par connexion
maintenance_work_mem = 512MB
huge_pages = try

# --- Écriture / durabilité ---------------------------------------------
# wal_level = replica est requis par pgBackRest pour le PITR.
wal_level = replica
max_wal_senders = 3
wal_compression = on
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# archive_mode : indispensable au PITR. pgBackRest reçoit chaque segment WAL,
# ce qui permet de restaurer à une seconde près et non au dernier dump.
archive_mode = on
archive_command = 'pgbackrest --stanza=ecolpro archive-push %p'
archive_timeout = 60s

# --- Planificateur (SSD/NVMe) ------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# --- Parallélisme -------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Sécurité : authentification ---------------------------------------
# scram-sha-256 remplace md5 (cassé). Impose aussi le hachage des futurs
# mots de passe dans ce schéma.
password_encryption = scram-sha-256

# TLS interne. Les certificats sont générés au premier démarrage par
# l'init (voir docker/postgres/init/00-tls.sh). Le trafic PostgreSQL ne
# quitte pas le réseau Docker, mais le chiffrer empêche l'écoute passive
# depuis un autre conteneur compromis.
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
ssl_prefer_server_ciphers = on

# --- Audit (pgaudit) ----------------------------------------------------
shared_preload_libraries = 'pgaudit'

# ddl   : toute modification de schéma (CREATE/ALTER/DROP)
# role  : toute modification de droits (GRANT/REVOKE/CREATE ROLE)
# write : INSERT/UPDATE/DELETE/TRUNCATE
#
# On n'audite PAS 'read' : sur une application scolaire, le volume de SELECT
# saturerait les journaux et masquerait les évènements importants. Les lectures
# sensibles sont déjà tracées applicativement dans la table audit_logs.
pgaudit.log = 'ddl, role, write'
pgaudit.log_catalog = off
pgaudit.log_parameter = on
pgaudit.log_relation = on
pgaudit.log_statement_once = off

# --- Journalisation -----------------------------------------------------
log_destination = 'stderr'
logging_collector = off               # Docker capture stderr
log_min_duration_statement = 500      # requêtes > 500 ms
log_min_messages = warning
log_min_error_statement = error
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_error_verbosity = default
log_statement = 'none'                # pgaudit s'en charge, plus finement

# --- Autovacuum ---------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# --- Statistiques -------------------------------------------------------
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl

# --- Divers -------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
statement_timeout = 60s               # borne les requêtes qui dérapent
idle_in_transaction_session_timeout = 300s   # libère les transactions oubliées
lock_timeout = 10s
