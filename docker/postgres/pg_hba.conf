# ============================================================
# EcolPro — pg_hba.conf (contrôle d'accès PostgreSQL)
#
# Principe : aucune connexion en confiance (`trust`), aucun `md5`.
# Tout passe par scram-sha-256. Le réseau autorisé est restreint au
# sous-réseau Docker interne — PostgreSQL n'est de toute façon jamais
# publié sur l'hôte (voir docker-compose.yml).
# ============================================================

# TYPE   DATABASE     USER              ADDRESS          METHOD

# --- Socket Unix local : réservé à la maintenance dans le conteneur -------
# `peer` fait correspondre l'utilisateur système à l'utilisateur PostgreSQL :
# seul l'utilisateur `postgres` du conteneur peut s'en servir.
local    all          postgres                           peer
local    all          all                                scram-sha-256

# --- Réplication (pgBackRest) --------------------------------------------
local    replication  all                                peer
host     replication  ecolpro_backup    127.0.0.1/32     scram-sha-256
host     replication  ecolpro_backup    ::1/128          scram-sha-256

# --- Connexions applicatives depuis le réseau Docker ---------------------
# 172.16.0.0/12 couvre les plages que Docker attribue à ses bridges.
# Le chiffrement est exigé (`hostssl`) pour que le trafic ne circule pas en
# clair entre conteneurs : un conteneur compromis ne peut pas écouter les
# identifiants ou les données des élèves.
hostssl  all          ecolpro_app       172.16.0.0/12    scram-sha-256
hostssl  all          ecolpro_owner     172.16.0.0/12    scram-sha-256
hostssl  all          ecolpro_backup    172.16.0.0/12    scram-sha-256
hostssl  all          ecolpro_ro        172.16.0.0/12    scram-sha-256

# --- Superutilisateur : jamais par le réseau -----------------------------
# `postgres` n'est joignable que par le socket Unix, donc uniquement via
# `docker exec`. Aucune escalade possible depuis le réseau, même avec le
# mot de passe.
host     all          postgres          0.0.0.0/0        reject
host     all          postgres          ::/0             reject

# --- Refus explicite de tout le reste ------------------------------------
host     all          all               0.0.0.0/0        reject
host     all          all               ::/0             reject
