;; ============================================================
;; EcolPro — Configuration PgBouncer
;;
;; Mode transaction : une connexion serveur n'est attribuée à un client
;; que pour la durée d'une transaction. C'est ce qui permet la
;; mutualisation, mais cela interdit les fonctionnalités liées à la
;; session (prepared statements nommés, LISTEN/NOTIFY, curseurs WITH HOLD).
;; Prisma doit donc être averti via `?pgbouncer=true` dans DATABASE_URL,
;; ce qui désactive ses prepared statements nommés.
;;
;; Les migrations Prisma (DDL) NE passent PAS par PgBouncer : elles
;; utilisent DIRECT_URL vers PostgreSQL, car `migrate deploy` a besoin
;; d'advisory locks au niveau session.
;; ============================================================

[databases]
;; Une seule base exposée. Le mot de passe n'est pas indiqué ici : PgBouncer
;; relaie les identifiants du client (userlist.txt), ce qui préserve la
;; distinction entre ecolpro_app et ecolpro_owner côté PostgreSQL.
ecolpro = host=db port=5432 dbname=ecolpro

[pgbouncer]

;; --- Écoute ----------------------------------------------------------
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer

;; --- Authentification des clients ------------------------------------
;; scram-sha-256 : md5 est cryptographiquement cassé et ne doit plus servir.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; --- Administration --------------------------------------------------
;; Seul `pgbouncer_admin` peut consulter les statistiques (SHOW POOLS…).
;; Les rôles applicatifs n'ont aucun accès à la console d'administration.
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

;; --- Mutualisation ---------------------------------------------------
pool_mode = transaction

;; max_client_conn : nombre de clients simultanés acceptés (côté app).
;; default_pool_size : connexions serveur réelles par couple (base, rôle).
;; 25 × ~3 rôles reste bien sous les 100 de max_connections PostgreSQL,
;; en laissant de la marge pour les migrations et pgBackRest.
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80
max_user_connections = 80

;; --- Délais ----------------------------------------------------------
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 2
client_login_timeout = 60
query_wait_timeout = 120
;; idle_transaction_timeout coupe les transactions oubliées, qui bloqueraient
;; une connexion serveur du pool indéfiniment.
idle_transaction_timeout = 300

;; --- TLS vers PostgreSQL (obligatoire) -------------------------------
;; pg_hba.conf n'accepte que `hostssl` : sans TLS, la connexion est refusée.
;; `require` chiffre sans vérifier l'autorité — suffisant ici, le certificat
;; est auto-signé et le trafic reste dans le réseau Docker.
server_tls_sslmode = require

;; --- TLS depuis l'application ----------------------------------------
;; Chiffre aussi le segment app → PgBouncer, pour qu'un conteneur compromis
;; sur le même réseau ne puisse pas lire les données en transit.
client_tls_sslmode = allow
client_tls_cert_file = /etc/pgbouncer/tls/server.crt
client_tls_key_file = /etc/pgbouncer/tls/server.key

;; --- Journalisation --------------------------------------------------
;; Sortie sur stdout : Docker collecte, aucun fichier à faire tourner.
logfile =
pidfile = /var/run/pgbouncer/pgbouncer.pid
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 300
verbose = 0

;; --- Divers ----------------------------------------------------------
ignore_startup_parameters = extra_float_digits,search_path,options
application_name_add_host = 1
;; Nettoie l'état de session avant de rendre la connexion au pool : évite
;; qu'un paramètre `app.tenant_id` d'un tenant ne fuite vers le suivant.
server_reset_query = DISCARD ALL
server_reset_query_always = 1
