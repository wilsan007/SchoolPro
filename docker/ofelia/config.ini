; ============================================================
; EcolPro — Ordonnanceur Ofelia
;
; Remplace Vercel Cron. Ofelia exécute les commandes DANS les conteneurs
; existants (`job-exec`), en passant par un mandataire du socket Docker
; restreint aux opérations `exec` : il ne peut pas créer de conteneur,
; monter de volume, ni obtenir le mode privilégié.
;
; Les horaires sont en UTC (postgresql.conf et les conteneurs sont en UTC).
; Djibouti est en UTC+3 : 02h00 UTC correspond à 05h00 heure locale, soit
; hors des heures de classe.
;
; Convention de planification Ofelia :
;   @every <durée>        intervalle
;   <m> <h> <j> <M> <js>  expression cron classique
; ============================================================

; ============================================================
; TÂCHES APPLICATIVES (remplacent vercel.json)
; ============================================================

; --- Répartition des notifications planifiées -----------------------------
; Était planifié quotidiennement dans vercel.json, mais le code prévoit un
; passage toutes les 5 minutes (voir le commentaire de la route). Un rythme
; quotidien retarderait d'un jour les rappels aux parents.
[job-exec "cron-dispatch-scheduled"]
schedule = @every 5m
container = ecolpro-app
command = node /app/cron-call.js dispatch-scheduled
no-overlap = true

; --- Répartition des communications ---------------------------------------
[job-exec "cron-dispatch"]
schedule = 0 2 * * *
container = ecolpro-app
command = node /app/cron-call.js dispatch
no-overlap = true

; --- Purge des sites supprimés (après période de grâce) -------------------
[job-exec "cron-purge-sites"]
schedule = 0 3 * * *
container = ecolpro-app
command = node /app/cron-call.js purge-sites
no-overlap = true

; --- Traitement de la file d'évènements LEARNOS ---------------------------
; Alimente le moteur pédagogique de façon asynchrone : la saisie des notes
; ne doit jamais attendre LEARNOS.
[job-exec "cron-learnos-events"]
schedule = @every 10m
container = ecolpro-app
command = node /app/cron-call.js learnos-events
no-overlap = true

; ============================================================
; SAUVEGARDES (pgBackRest)
; ============================================================

; --- Complète : dimanche 02h00 UTC ---------------------------------------
[job-exec "backup-full"]
schedule = 0 2 * * 0
container = ecolpro-db
command = /usr/local/bin/pg-backup.sh full
no-overlap = true

; --- Différentielle : lundi à samedi 02h00 UTC ---------------------------
; Ne sauvegarde que ce qui a changé depuis la dernière complète : quelques
; dizaines de Mo au lieu de plusieurs Go.
[job-exec "backup-diff"]
schedule = 0 2 * * 1-6
container = ecolpro-db
command = /usr/local/bin/pg-backup.sh diff
no-overlap = true

; --- Incrémentale : toutes les 6 h ---------------------------------------
; Réduit la perte potentielle de données. Combinée à l'archivage continu
; des WAL, la restauration reste possible à la seconde près.
[job-exec "backup-incr"]
schedule = 0 8,14,20 * * *
container = ecolpro-db
command = /usr/local/bin/pg-backup.sh incr
no-overlap = true

; ============================================================
; VÉRIFICATIONS DE SÉCURITÉ ET DE RÉSILIENCE
; ============================================================

; --- Test de restauration : mercredi 04h00 UTC ---------------------------
; Une sauvegarde jamais restaurée n'est pas une sauvegarde. Ce test
; reconstruit réellement la base dans un répertoire temporaire et compare
; le nombre de lignes des tables clés. Alerte Telegram en cas d'échec.
[job-exec "backup-verify"]
schedule = 0 4 * * 3
container = ecolpro-db
command = /usr/local/bin/backup-verify.sh
no-overlap = true

; --- Audit de sécurité : lundi 06h00 UTC ---------------------------------
; Exécuté depuis le conteneur PostgreSQL, qui possède psql : il contrôle la
; partie base de données (rôles, privilèges, chiffrement, fraîcheur des
; sauvegardes). Les contrôles au niveau du système d'exploitation sont
; lancés séparément sur l'hôte (`make audit`), car un conteneur ne peut pas
; inspecter fiablement l'hôte — et ne doit surtout pas en avoir le pouvoir.
[job-exec "security-audit-db"]
schedule = 0 6 * * 1
container = ecolpro-db
command = /usr/local/bin/security-audit-db.sh
no-overlap = true
