[global]
# ============================================================
# EcolPro — Configuration pgBackRest
#
# Pourquoi pgBackRest plutôt que pg_dump ?
#   - sauvegardes INCRÉMENTALES : quelques Mo par jour au lieu d'un dump
#     complet, donc une fréquence élevée devient possible ;
#   - PITR (Point-In-Time Recovery) : restauration à la seconde près grâce
#     à l'archivage des WAL. Avec pg_dump, on perd tout depuis le dernier
#     dump — jusqu'à 24 h de notes, absences et paiements ;
#   - vérification intégrée des sommes de contrôle : une sauvegarde
#     corrompue est détectée à la création, pas le jour de l'incident.
#
# IMPORTANT — gestion des secrets :
# pgBackRest ne substitue PAS les variables dans ce fichier. Les valeurs
# sensibles sont donc fournies par l'environnement, selon la convention
# PGBACKREST_<OPTION_EN_MAJUSCULES_AVEC_UNDERSCORES>. Elles n'apparaissent
# ainsi jamais en clair sur le disque :
#
#   repo1-cipher-pass    → PGBACKREST_REPO1_CIPHER_PASS
#   repo2-s3-key         → PGBACKREST_REPO2_S3_KEY
#   repo2-s3-key-secret  → PGBACKREST_REPO2_S3_KEY_SECRET
#
# Ces variables sont injectées par docker-compose depuis les secrets SOPS.
# ============================================================

# --- Dépôt 1 : local (rapide à restaurer) ---------------------------------
repo1-path=/var/lib/pgbackrest
# Le chiffrement est actif ; la phrase secrète vient de
# PGBACKREST_REPO1_CIPHER_PASS. Sans elle, pgBackRest refuse de démarrer.
repo1-cipher-type=aes-256-cbc

# Rétention : 2 sauvegardes complètes conservées, et les WAL nécessaires
# pour restaurer à n'importe quel instant couvert par ces deux complètes.
repo1-retention-full=2
repo1-retention-diff=6
repo1-retention-archive-type=full
repo1-retention-archive=2

# --- Dépôt 2 : hors site (survit à la perte du VPS) -----------------------
# ATTENTION : une sauvegarde stockée sur la machine à sauvegarder ne protège
# de RIEN en cas de perte du VPS, de chiffrement par rançongiciel ou de
# suppression du compte hébergeur. Le dépôt hors site n'est pas optionnel
# pour des données scolaires réglementées.
#
# Le dépôt distant N'EST PAS déclaré ici, et c'est délibéré : pgBackRest
# refuse de fonctionner si un dépôt déclaré est injoignable. Un bloc repo2
# écrit en dur casserait donc toutes les sauvegardes tant que les
# identifiants ne sont pas fournis — raison pour laquelle la version
# précédente de ce fichier le laissait commenté, et pour laquelle il n'a
# jamais été activé.
#
# À la place, /usr/local/bin/pgbackrest-offsite.sh écrit
# /etc/pgbackrest/conf.d/10-offsite.conf au début de chaque sauvegarde,
# UNIQUEMENT si les identifiants sont présents dans l'environnement.
# pgBackRest fusionne automatiquement conf.d avec ce fichier.
#
# Activation : renseigner R2_S3_ENDPOINT, R2_BACKUP_BUCKET,
# R2_BACKUP_ACCESS_KEY_ID et R2_BACKUP_SECRET_ACCESS_KEY dans les secrets,
# puis `make backup-offsite-init`. Procédure détaillée : RUNBOOK.md.

# --- Performance ----------------------------------------------------------
# 2 processus : compromis pour un VPS 4 vCPU, la sauvegarde ne doit pas
# affamer l'application.
process-max=2
compress-type=zst
compress-level=6

# --- Intégrité ------------------------------------------------------------
# Relit les pages pour détecter une corruption silencieuse du disque.
checksum-page=y

# --- Journalisation -------------------------------------------------------
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
log-subprocess=y

# --- Archivage des WAL ----------------------------------------------------
# async accélère archive-push en groupant les segments : sans cela, un pic
# d'écriture peut faire prendre du retard à l'archivage et bloquer
# PostgreSQL une fois max_wal_size atteint.
archive-async=y
archive-push-queue-max=1GB
spool-path=/var/spool/pgbackrest

# --- Verrous --------------------------------------------------------------
lock-path=/tmp/pgbackrest

[ecolpro]
# --- La grappe à sauvegarder ---------------------------------------------
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
pg1-socket-path=/var/run/postgresql
