# Docker Compose — Outils de contrôle qualité
# Postgres 16 avec toutes les extensions pour tests locaux

services:
  postgres-tools:
    build: ./docker/pg-tools
    container_name: schoolpro-pg-tools
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: schoolpro
      POSTGRES_PASSWORD: schoolpro_tools
      POSTGRES_DB: schoolpro_tools
    command: >
      postgres
      -c shared_preload_libraries='pg_stat_statements,auto_explain,pgaudit'
      -c pg_stat_statements.track=all
      -c auto_explain.log_min_duration=100
      -c auto_explain.log_analyze=true
      -c auto_explain.log_buffers=true
      -c pgaudit.log='read,write,ddl,role'
      -c pgaudit.log_catalog=off
      -c max_connections=20
    volumes:
      - pg_tools_data:/var/lib/postgresql/data
      - ./docker/pg-tools/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolpro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_tools_data:
