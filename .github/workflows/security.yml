# ============================================================
# EcolPro — Gardes de sécurité en intégration continue
#
# PRINCIPE
# Une personne seule ne peut pas être vigilante en permanence ; une CI le
# peut. Chaque contrôle ci-dessous remplace une inspection manuelle qu'on
# finirait, tôt ou tard, par ne plus faire — et le fait à chaque
# modification, sans exception ni jour de congé.
#
# Ce qui échoue BLOQUE la fusion (isolation, secrets, vulnérabilités
# critiques). Ce qui informe est signalé sans bloquer (CVE moyennes,
# CodeQL), pour qu'un échec reste un signal fort plutôt qu'un voyant rouge
# permanent que l'on cesse de regarder.
# ============================================================
name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Lundi 05h00 UTC (08h00 à Djibouti). Une CVE peut être publiée sans
    # qu'une seule ligne du dépôt ne change : sans exécution planifiée, on
    # ne l'apprendrait qu'au prochain commit.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:

  # ==========================================================
  # Isolation multi-tenant — le contrôle le plus important
  # ==========================================================
  # Il n'existe aucune façon de vérifier honnêtement la RLS sans un vrai
  # PostgreSQL configuré comme celui de production : un rôle
  # superutilisateur la contourne intégralement, et tous les tests
  # passeraient au vert sans rien prouver. On monte donc le labo complet.
  isolation:
    name: Isolation multi-tenant (RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Générer le client Prisma
        run: pnpm exec prisma generate
        env:
          # Valeurs factices : `prisma generate` exige que les variables
          # existent, mais ne se connecte à rien. Aucun secret de dépôt
          # n'est donc nécessaire pour ce job — un job de sécurité qui
          # réclame des secrets de production est un job qu'on finit par
          # désactiver.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Les politiques RLS suivent-elles le schéma ?
        # Échoue si une table a été ajoutée au schéma sans être couverte
        # par une politique — l'oubli le plus probable, et le plus coûteux.
        run: pnpm rls:check

      - name: Démarrer le labo fidèle à la production
        run: make test-db-up

      - name: Appliquer schéma, fonctions et politiques
        run: make rls-apply-test

      - name: Prouver l'isolation
        run: make rls-test

      - name: Journaux du labo en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.test.yml logs db --tail 100

  # ==========================================================
  # Cohérence de l'infrastructure
  # ==========================================================
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker-compose est-il valide et complet ?
        # Détecte une variable référencée par le compose mais absente du
        # fichier d'exemple — le déploiement échouerait alors sur le VPS,
        # au pire moment.
        run: docker compose --env-file .env.production.example config -q

      - name: Aucun port publié sur l'hôte
        # La stack ne doit exposer AUCUN port : le trafic entre par un
        # tunnel Cloudflare sortant. Un `ports:` ajouté par inadvertance
        # contournerait aussi le pare-feu (Docker écrit ses règles en amont
        # d'UFW) — la régression la plus silencieuse de cette architecture.
        run: |
          if grep -nE '^\s+-\s+"?[0-9]+:[0-9]+' docker-compose.yml; then
            echo "::error::Un service publie un port sur l'hôte. Interdit : voir l'en-tête de docker-compose.yml."
            exit 1
          fi
          echo "Aucun port publié."

      - name: Cohérence des scripts shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning docker/scripts/*.sh || true
          for f in docker/scripts/*.sh; do bash -n "$f" || exit 1; done

  # ==========================================================
  # Secrets committés par inadvertance
  # ==========================================================
  secrets:
    name: Fuite de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : un secret retiré au commit suivant reste
          # dans l'historique, et reste donc compromis.
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose --no-banner

  # ==========================================================
  # Vulnérabilités des dépendances et des images
  # ==========================================================
  vulnerabilites:
    name: Vulnérabilités
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dépendances npm — critiques uniquement (bloquant)
        run: pnpm audit --audit-level critical

      - name: Dépendances npm — inventaire complet (informatif)
        if: always()
        run: pnpm audit || true

      - name: Construire l'image PostgreSQL
        run: docker build -f docker/postgres/Dockerfile -t ecolpro/postgres:ci .

      - name: Trivy — image PostgreSQL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ecolpro/postgres:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Trivy — dépendances et configuration du dépôt
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  # ==========================================================
  # Analyse statique du code applicatif
  # ==========================================================
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-extended` ajoute les requêtes de qualité qui touchent
          # à la sécurité (injections indirectes, validations manquantes) —
          # celles qu'une relecture humaine laisse passer le plus souvent.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
