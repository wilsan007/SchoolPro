# ============================================================
# EcolPro — Postgres de développement local
#
# Un seul conteneur, un seul rôle superutilisateur, port publié en local
# uniquement. Aucune donnée réelle : à l'opposé de docker-compose.yml
# (la stack de production durcie — 4 rôles, TLS, pgaudit, réseaux
# segmentés, zéro port publié), qui reste le bon endroit pour ce
# niveau d'exigence.
#
# Contexte (2026-08-21) : le développement pointait jusque-là sur un
# projet Supabase distant. Ce projet a été fermé ; ce fichier lui
# succède, pour éviter que le développement quotidien ne touche par
# défaut les vraies données de production (voir scripts/dev-tunnel-vps.sh
# pour l'alternative volontaire « contre la prod »).
#
# Démarrage :
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm prisma migrate deploy   # ou: pnpm db:push
#   pnpm db:seed                 # optionnel — jeu de données de démo
#
# Arrêt (en gardant les données) :
#   docker compose -f docker-compose.dev.yml stop
#
# Remise à zéro complète (efface les données) :
#   docker compose -f docker-compose.dev.yml down -v
# ============================================================

services:
  db:
    image: postgres:17-alpine
    container_name: ecolpro-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecolpro_dev
      POSTGRES_USER: ecolpro_dev
      # Mot de passe fixe et public : base locale, jamais exposée au-delà
      # de 127.0.0.1. Ne JAMAIS reprendre cette valeur en production.
      POSTGRES_PASSWORD: ecolpro_dev_local_only
    ports:
      # Publié sur 127.0.0.1 uniquement — pas 0.0.0.0 : une autre machine
      # du réseau local ne doit pas pouvoir s'y connecter.
      # Port 55432, pas le 5432 par défaut : laisse la place à un Postgres
      # d'un autre projet déjà présent sur la machine de développement.
      - "127.0.0.1:55432:5432"
    volumes:
      - ecolpro_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init-dev/01-extensions-dev.sql:/docker-entrypoint-initdb.d/01-extensions-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecolpro_dev -d ecolpro_dev -q"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ecolpro_dev_data:
